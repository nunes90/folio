name: AppImage

# Gera o AppImage quando uma Release é publicada (gh release create …) e o anexa a ela (M6a).
# Também roda à mão (aba Actions → AppImage → Run workflow) e em PRs que mexem no empacotamento:
# aí o AppImage fica só como artefato do job, para testar sem criar Release.
on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/appimage.yml
      - crates/app/tauri.conf.json
      - crates/app/folio.desktop
      - crates/app/icons/**
      - scripts/testar_appimage.sh
      - crates/core/src/kokoro/fonemas.rs

permissions:
  contents: write
  # Para a atestação de proveniência do AppImage (quem o gerou, de qual commit).
  id-token: write
  attestations: write

env:
  CARGO_TERM_COLOR: always

jobs:
  appimage:
    name: AppImage
    # A versão mais antiga do Ubuntu disponível: o AppImage leva as bibliotecas do sistema em
    # que foi feito, e uma glibc mais antiga roda em mais distribuições.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Dependências do Tauri e do AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libasound2-dev \
            patchelf libfuse2 file cmake

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # Guarda também o tauri-cli instalado (~/.cargo/bin) entre as execuções.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Dependências do frontend
        working-directory: ui
        run: npm ci

      # Os avisos de terceiros vão no AppImage: sempre os dos lockfiles desta versão.
      - name: Avisos de terceiros
        run: python3 scripts/avisos_de_terceiros.py

      # O espeak-ng da voz natural vai no AppImage (M27d-2), em usr/lib/folio/espeak-ng (o app o procura
      # ali antes do sistema). Compilado aqui só com o que os fonemas usam: sem saída de som, mbrola,
      # sonic, klatt nem dicionários extras. O pacote do Ubuntu puxaria o PulseAudio, o libsndfile e mais
      # uma dúzia de bibliotecas. Dos dicionários, só os dos idiomas da voz natural (inglês; português
      # para o pt-BR). GPL-3.0-or-later, como o Folio; sem alterações (o código é o da tag).
      - name: espeak-ng
        run: |
          VERSAO=1.52.0
          curl -sSL -o espeak-ng.tar.gz "https://github.com/espeak-ng/espeak-ng/archive/refs/tags/$VERSAO.tar.gz"
          echo "bb4338102ff3b49a81423da8a1a158b420124b055b60fa76cfb4b18677130a23  espeak-ng.tar.gz" | sha256sum -c
          tar xzf espeak-ng.tar.gz
          cmake -S "espeak-ng-$VERSAO" -B espeak-build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DCMAKE_INSTALL_PREFIX=/usr -DUSE_MBROLA=OFF -DUSE_LIBSONIC=OFF -DUSE_LIBPCAUDIO=OFF -DUSE_KLATT=OFF \
            -DUSE_SPEECHPLAYER=OFF -DUSE_ASYNC=OFF -DESPEAK_BUILD_MANPAGES=OFF -DEXTRA_cmn=OFF -DEXTRA_ru=OFF -DEXTRA_yue=OFF
          cmake --build espeak-build -j"$(nproc)"
          DESTDIR="$PWD/espeak-inst" cmake --install espeak-build
          E="$PWD/espeak-embutido"
          mkdir -p "$E"
          cp -L "$(find espeak-inst -name libespeak-ng.so.1 | head -1)" "$E/"
          cp -r "$(find espeak-inst -type d -name espeak-ng-data | head -1)" "$E/"
          find "$E/espeak-ng-data" -maxdepth 1 -name '*_dict' ! -name en_dict ! -name pt_dict -delete
          cp "espeak-ng-$VERSAO/COPYING" "$E/"
          printf 'eSpeak NG %s (GPL-3.0-or-later), sem alterações.\nCódigo: https://github.com/espeak-ng/espeak-ng/tree/%s\n' \
            "$VERSAO" "$VERSAO" > "$E/LEIA-ME"
          ldd "$E/libespeak-ng.so.1"
          if ldd "$E/libespeak-ng.so.1" | grep -E "pulse|pcaudio|sonic|not found"; then exit 1; fi
          du -sh "$E"
          echo "ESPEAK_EMBUTIDO=$E" >> "$GITHUB_ENV"

      - name: tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Gerar o AppImage
        run: |
          cargo tauri build --bundles appimage \
            --config "{\"bundle\":{\"linux\":{\"appimage\":{\"files\":{\"/usr/lib/folio/espeak-ng\":\"$ESPEAK_EMBUTIDO\"}}}}}" \
            -- --locked

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: appimage
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # O AppImage em sistemas sem nada do Tauri instalado, antes de ir para a Release (M6b). Além das
  # ferramentas do teste, só o que o linuxdeploy deixa de fora por ser de qualquer desktop gráfico
  # (fontes, OpenGL, X11, Wayland): os contêineres são mínimos demais, e sem isso nem inicia. O WebKitGTK
  # carrega a libGLESv2 durante a execução, e sem ela fecha (ver "Instalar" no README).
  testar:
    name: Testar em ${{ matrix.imagem }}
    needs: appimage
    runs-on: ubuntu-24.04
    container: ${{ matrix.imagem }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - imagem: ubuntu:24.04
            instalar: apt-get update && apt-get install -y xvfb xauth dbus sqlite3 desktop-file-utils libfontconfig1 libfreetype6 libharfbuzz0b libfribidi0 libgl1 libegl1 libgles2 libgl1-mesa-dri libgbm1 libdrm2 libx11-6 libx11-xcb1 libxcb1 libwayland-client0 libexpat1 zlib1g libgmp10 libgpg-error0 libcom-err2 libasound2t64 fonts-dejavu-core
          - imagem: debian:stable
            instalar: apt-get update && apt-get install -y xvfb xauth dbus sqlite3 desktop-file-utils libfontconfig1 libfreetype6 libharfbuzz0b libfribidi0 libgl1 libegl1 libgles2 libgl1-mesa-dri libgbm1 libdrm2 libx11-6 libx11-xcb1 libxcb1 libwayland-client0 libexpat1 zlib1g libgmp10 libgpg-error0 libcom-err2 libasound2t64 fonts-dejavu-core
          - imagem: fedora:latest
            instalar: dnf install -y xorg-x11-server-Xvfb xorg-x11-xauth dbus-daemon sqlite desktop-file-utils which findutils util-linux fontconfig freetype harfbuzz fribidi libglvnd-glx libglvnd-egl libglvnd-gles mesa-dri-drivers mesa-libgbm libdrm libX11 libX11-xcb libxcb libwayland-client expat zlib gmp libgpg-error libcom_err alsa-lib dejavu-sans-fonts
          - imagem: archlinux:latest
            instalar: pacman -Syu --noconfirm xorg-server-xvfb xorg-xauth dbus sqlite desktop-file-utils fontconfig freetype2 harfbuzz fribidi libglvnd mesa libdrm libx11 libxcb wayland expat zlib gmp libgpg-error e2fsprogs alsa-lib ttf-dejavu
    steps:
      - name: Ferramentas do teste
        run: ${{ matrix.instalar }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: appimage
          path: appimage

      - name: EPUB
        run: |
          chmod +x appimage/*.AppImage
          xvfb-run --auto-servernum dbus-run-session -- scripts/testar_appimage.sh appimage/*.AppImage tests/fixtures/dom-casmurro.epub

      - name: PDF
        run: xvfb-run --auto-servernum dbus-run-session -- scripts/testar_appimage.sh appimage/*.AppImage tests/fixtures/texto.pdf

  anexar:
    name: Anexar à Release
    if: github.event_name == 'release'
    needs: testar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: appimage
          path: appimage

      - name: Anexar à Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # As somas ao lado do AppImage: `sha256sum -c SHA256SUMS` confere o que foi baixado.
          (cd appimage && sha256sum *.AppImage > SHA256SUMS && cat SHA256SUMS)
          gh release upload "${{ github.event.release.tag_name }}" appimage/*.AppImage appimage/SHA256SUMS --clobber --repo "${{ github.repository }}"

      # Prova de que este AppImage saiu deste repositório e deste workflow (`gh attestation verify`).
      # Não impede a Release se o serviço falhar: o AppImage e as somas já foram anexados.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        continue-on-error: true
        with:
          subject-path: appimage/*.AppImage
