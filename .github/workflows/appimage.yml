name: AppImage

# Gera o AppImage quando uma Release é publicada (gh release create …) e o anexa a ela (M6a).
# Também roda à mão (aba Actions → AppImage → Run workflow) e em PRs que mexem no empacotamento:
# aí o AppImage fica só como artefato do job, para testar sem criar Release.
on:
  release:
    types: [published]
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/appimage.yml
      - crates/app/tauri.conf.json
      - crates/app/folio.desktop
      - crates/app/icons/**
      - scripts/testar_appimage.sh

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  appimage:
    name: AppImage
    # A versão mais antiga do Ubuntu disponível: o AppImage leva as bibliotecas do sistema em
    # que foi feito, e uma glibc mais antiga roda em mais distribuições.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Dependências do Tauri e do AppImage
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev \
            patchelf libfuse2 file

      - uses: dtolnay/rust-toolchain@stable

      # Guarda também o tauri-cli instalado (~/.cargo/bin) entre as execuções.
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Dependências do frontend
        working-directory: ui
        run: npm ci

      # Os avisos de terceiros vão no AppImage: sempre os dos lockfiles desta versão.
      - name: Avisos de terceiros
        run: python3 scripts/avisos_de_terceiros.py

      - name: tauri-cli
        run: cargo install tauri-cli --version "^2" --locked

      - name: Gerar o AppImage
        run: cargo tauri build --bundles appimage -- --locked

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # O AppImage em sistemas sem nada do Tauri instalado, antes de ir para a Release (M6b). Além das
  # ferramentas do teste, só o que o linuxdeploy deixa de fora por ser de qualquer desktop gráfico
  # (fontes, OpenGL, X11, Wayland): os contêineres são mínimos demais, e sem isso nem inicia. O WebKitGTK
  carrega a libGLESv2 durante a execução, e sem ela fecha (ver "Requisitos" no README).
  testar:
    name: Testar em ${{ matrix.imagem }}
    needs: appimage
    runs-on: ubuntu-latest
    container: ${{ matrix.imagem }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - imagem: ubuntu:24.04
            instalar: apt-get update && apt-get install -y xvfb xauth dbus sqlite3 desktop-file-utils libfontconfig1 libfreetype6 libharfbuzz0b libfribidi0 libgl1 libegl1 libgles2 libgl1-mesa-dri libgbm1 libdrm2 libx11-6 libx11-xcb1 libxcb1 libwayland-client0 libexpat1 zlib1g libgmp10 libgpg-error0 libcom-err2 fonts-dejavu-core
          - imagem: debian:stable
            instalar: apt-get update && apt-get install -y xvfb xauth dbus sqlite3 desktop-file-utils libfontconfig1 libfreetype6 libharfbuzz0b libfribidi0 libgl1 libegl1 libgles2 libgl1-mesa-dri libgbm1 libdrm2 libx11-6 libx11-xcb1 libxcb1 libwayland-client0 libexpat1 zlib1g libgmp10 libgpg-error0 libcom-err2 fonts-dejavu-core
          - imagem: fedora:latest
            instalar: dnf install -y xorg-x11-server-Xvfb xorg-x11-xauth dbus-daemon sqlite desktop-file-utils which findutils util-linux fontconfig freetype harfbuzz fribidi libglvnd-glx libglvnd-egl libglvnd-gles mesa-dri-drivers mesa-libgbm libdrm libX11 libX11-xcb libxcb libwayland-client expat zlib gmp libgpg-error libcom_err dejavu-sans-fonts
          - imagem: archlinux:latest
            instalar: pacman -Syu --noconfirm xorg-server-xvfb xorg-xauth dbus sqlite desktop-file-utils fontconfig freetype2 harfbuzz fribidi libglvnd mesa libdrm libx11 libxcb wayland expat zlib gmp libgpg-error e2fsprogs ttf-dejavu
    steps:
      - name: Ferramentas do teste
        run: ${{ matrix.instalar }}

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: appimage
          path: appimage

      - name: EPUB
        run: |
          chmod +x appimage/*.AppImage
          xvfb-run --auto-servernum dbus-run-session -- scripts/testar_appimage.sh appimage/*.AppImage tests/fixtures/dom-casmurro.epub

      - name: PDF
        run: xvfb-run --auto-servernum dbus-run-session -- scripts/testar_appimage.sh appimage/*.AppImage tests/fixtures/texto.pdf

  anexar:
    name: Anexar à Release
    if: github.event_name == 'release'
    needs: testar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: appimage
          path: appimage

      - name: Anexar à Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" appimage/*.AppImage --clobber --repo "${{ github.repository }}"
