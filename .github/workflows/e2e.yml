name: E2E

# Testes de ponta a ponta (M26c): o app compilado, dirigido pelo WebdriverIO através do
# tauri-driver e do WebKitWebDriver, numa tela virtual (xvfb). Ver e2e/wdio.conf.js.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: E2E (${{ matrix.os }})
    # Também no Ubuntu 22.04: é o WebKitGTK que o AppImage leva (2.50), e ele se comporta diferente do
    # mais novo (ex.: o for await do pdf.js, a seleção na v1.1.0). O WebDriver tem outro nome lá.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            driver: webkitgtk-webdriver
          - os: ubuntu-22.04
            driver: webkit2gtk-driver
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # webkitgtk-webdriver é o WebKitWebDriver (o guia do Tauri ainda o chama de webkit2gtk-driver,
      # o nome antigo); xvfb, a tela virtual; dbus-x11 para a sessão
      # do D-Bus que o WebKitGTK procura.
      - name: Dependências do Tauri e do WebDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libasound2-dev \
            ${{ matrix.driver }} xvfb dbus-x11

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # Guarda também o tauri-cli e o tauri-driver instalados (~/.cargo/bin) entre as execuções.
      # Um cache por sistema: o cargo-tauri compilado no Ubuntu mais novo não roda no 22.04 (glibc).
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.os }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            e2e/package-lock.json

      - name: Dependências do frontend
        working-directory: ui
        run: npm ci

      - name: tauri-cli e tauri-driver
        run: |
          cargo install tauri-cli --version "^2" --locked
          cargo install tauri-driver --locked

      - name: Compilar o app (debug, com o frontend embutido)
        run: cargo tauri build --debug --no-bundle -- --locked

      - name: Dependências dos testes
        working-directory: e2e
        run: npm ci

      - name: Testes
        working-directory: e2e
        run: xvfb-run --auto-servernum dbus-run-session -- npm test

      # As capturas de tela dos testes que falharam (e2e/wdio.conf.js, afterTest).
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-falhas-${{ matrix.os }}
          path: e2e/falhas/
          if-no-files-found: ignore
