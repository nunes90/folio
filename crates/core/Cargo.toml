[package]
name = "folio-core"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
libloading = "0.9.0"
lopdf = { version = "0.45.0", default-features = false }
# ONNX Runtime para a voz neural (Kokoro), carregado durante a execução (`load-dynamic`): a
# `libonnxruntime.so` oficial (MIT) é baixada junto com a voz. O binário pronto que a `ort` baixaria
# ao compilar exige a glibc 2.38, e o AppImage é compilado no Ubuntu 22.04 (2.35); a oficial, 2.28.
# `api-31` = ONNX Runtime 1.31.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "tracing", "api-31"] }
percent-encoding = "2.3.2"
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
quick-xml = "0.42.0"
regex = "1.13.1"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror.workspace = true
tracing.workspace = true
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
ureq = { version = "3.5.1", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier"] }
tar = "0.4.46"
flate2 = "1.1.10"

[dev-dependencies]
insta = "1.49.0"
proptest = "1"
tempfile = "3.27.0"
